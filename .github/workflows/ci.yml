name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/*.rs'
              - '.github/workflows/ci.yml'
            docker:
              - '**/docker-compose.yml'
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-rust.yml@6d49af28a19223af7709f7cb8c558d528554c617

  build-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-docker.yml@6d49af28a19223af7709f7cb8c558d528554c617
    with:
      paths: |
        .
        services/client-application
        services/server-application

  lint-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-rust.yml@6d49af28a19223af7709f7cb8c558d528554c617

  lint-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-docker.yml@6d49af28a19223af7709f7cb8c558d528554c617
    with:
      paths: |
        .
        services/client-application
        services/server-application

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@6d49af28a19223af7709f7cb8c558d528554c617

  ci:
    if: always()
    needs: [build-rust, build-docker, lint-rust, lint-docker, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
